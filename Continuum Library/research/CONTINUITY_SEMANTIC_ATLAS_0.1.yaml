continuity_semantic_atlas:
  metadata:
    title: CONTINUITY SEMANTIC ATLAS 0.1
    source_file: CONTINUITY_SEMANTIC_ATLAS_0.1.xlsx
    format_version: '0.1'
    export_format: YAML
    authority_note: Descriptive and experimental. Entries record survivors and useful handles; they grant no authority.
    primary_warning: Do not graph the universe. Do not turn the Atlas into authority, ontology gravity, or semantic furniture.
    experimental_rule: Keep the operation when the handle adds no unique value.
    purpose: A research atlas of concepts, operations, geometry, status, questions, scars, distinctions, navigation metaphors
      and high-density phrases recovered from the AI Tape / Guides / Wayfarer / Principles lineage.
    canonical_data: ATLAS is the primary dictionary. RELATIONS is the edge list. Other sheets provide specialist views.
    evidence_basis: Tape lineage, Continuity Guide, Unified Guide, T4A/T4A_FULL, Wayfarer, Continuity Principles 0.1-0.3,
      archaeology and semantic-leverage experiments.
    status: Research candidate
    suggested_next_work: Add source-level provenance, independent-model evidence, foreign-project examples and behavioural
      tests.
  taxonomy:
  - family: Reality
    purpose: Concepts describing project reality, state, content, or continuity cargo.
    examples: State, Force, Evidence, Gap, Scar, Asset
    primary_question: What exists or matters?
    typical_failure: Generic nouns without project grounding
    preferred_use: Describe continuity cargo.
  - family: Operation
    purpose: Verbs or cognitive operations that change, recover, test, or carry continuity.
    examples: Preserve, Recover, Distinguish, Rebase
    primary_question: What should intelligence do?
    typical_failure: Method theatre
    preferred_use: Activate behaviour.
  - family: Geometry
    purpose: Explicit relationships describing dependency, conditionality, consequence, or regression.
    examples: DEPENDS_ON, REOPEN_IF, PROTECTS_AGAINST
    primary_question: What must remain connected?
    typical_failure: Ontology soup
    preferred_use: Protect expensive project geometry.
  - family: Epistemic
    purpose: Words that distinguish observation, inference, proposal, certainty, and evidence state.
    examples: Observed, Interpreted, Proposed
    primary_question: What kind of knowing is this?
    typical_failure: Confidence by tone
    preferred_use: Preserve evidence boundaries.
  - family: Decision Status
    purpose: Words describing whether an inherited judgement is active, provisional, rejected, or open.
    examples: Adopted, Provisional, Rejected
    primary_question: What should the successor do with this?
    typical_failure: Status theatre
    preferred_use: Preserve disposition.
  - family: Gravity / Value
    purpose: Qualifiers that determine admission, priority, cost, or importance.
    examples: Material, Expensive, Active
    primary_question: How strongly should this influence judgement?
    typical_failure: Everything marked high
    preferred_use: Admission and priority.
  - family: Temporal / Directional
    purpose: Words describing survival, change, persistence, evolution, or future movement.
    examples: Survived, Changed, Remains
    primary_question: How does this behave through time?
    typical_failure: Chronology without consequence
    preferred_use: Evolution and applicability.
  - family: Boundary / Distinction
    purpose: Paired concepts whose collapse damages judgement.
    examples: Continuity != Identity
    primary_question: What must not collapse?
    typical_failure: False equivalence
    preferred_use: Protect decision boundaries.
  - family: Question
    purpose: Compact prompts that activate recovery or reasoning behaviour.
    examples: What still matters?
    primary_question: What reasoning should be activated?
    typical_failure: Question tourism
    preferred_use: Directed recovery.
  - family: Scar / Failure
    purpose: Named failure patterns that reactivate corrective judgement.
    examples: Chainsaw Compression, Abstraction Drift
    primary_question: What expensive failure should not recur?
    typical_failure: Fossilised prohibition
    preferred_use: Reactivate lessons.
  - family: Navigation / Depth
    purpose: Metaphors and structures controlling active attention and recoverable depth.
    examples: Landing, Map, Route, Archive
    primary_question: Where should continuity live?
    typical_failure: Map tourism
    preferred_use: Control attention and retrieval.
  - family: Transport
    purpose: Words and operations governing constrained crossing and survivability.
    examples: Payload, Checkpoint, Carrier
    primary_question: How does continuity survive the channel?
    typical_failure: Transport dominance
    preferred_use: Constrained crossing.
  - family: Phrase
    purpose: High-density expressions carrying operation, stance, or design memory.
    examples: Trust intelligence.
    primary_question: What dense stance or operation can a phrase activate?
    typical_failure: Slogan/furniture
    preferred_use: Compact activation.
  atlas:
  - id: R001
    handle: Reality
    primary_family: Reality
    secondary_family: Epistemic
    form: noun
    underlying_operation: Ground continuity in what materially exists or is established.
    meaning_function: The project or world as it is, independent of the continuity method.
    gravity: High
    status: Strong survivor
    evidence_status: Repeated across lineage
    failure_if_lost: Continuity becomes self-referential or invented.
    risk_if_overused: Can be invoked vaguely without specifying evidence.
    strong_connections: State; Evidence; Observation; Source reality
    contrast_boundary: Interpretation; simulation; invented completeness
    activation_question: What is actually true here?
    notes: Top-level grounding concept.
  - id: R002
    handle: State
